name: Check Copy

# Copy rules a machine can check. Sizes in prose use the multiplication sign
# ("1200 × 630"); the letter x is only for code and file names.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sizes use ×
        run: |
          if git grep -nIE '(^|[^0-9A-Za-z])[0-9]{2,5} x [0-9]{2,5}([^0-9]|$)' -- '*.md' '*.html' '*.txt' '**/action.yml' ':!**/vendor/**' ':!**/node_modules/**'; then
            echo "::error::Write sizes with × (1200 × 630), not the letter x."
            exit 1
          fi
